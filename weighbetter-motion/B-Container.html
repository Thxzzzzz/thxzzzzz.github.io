<script>
class DCLogic {
  constructor(props) { this.props = props; this.state = {}; }
  setState(patch) {
    const next = typeof patch === "function" ? patch(this.state, this.props) : patch;
    this.state = { ...this.state, ...next };
    window.dcRender();
  }
  forceUpdate() { window.dcRender(); }
}
</script>
<script>
class Component extends DCLogic {
  static EASE = 'cubic-bezier(0.2, 0, 0, 1)';
  // 卡片一侧与页面一侧的位置（按 Spectrum 2 画板 F1 / F2 的排版算出）。
  static CARD = {
    tile: { x: 32, y: 137.8, w: 84, h: 84, r: 10 },
    icon: { x: 38, y: 143.8, s: 72 / 152 },
    name: { x: 132, y: 144.6, s: 1 },
    last: { x: 195.5, y: 173.1, s: 1 },
    model: { x: 132, y: 195.6, s: 13 / 15 },
  };
  static PAGE = {
    tile: { x: 16, y: 110, w: 370, h: 184, r: 20 },
    icon: { x: 125, y: 126, s: 1 },
    name: { x: 167, y: 73.3, s: 17 / 19 },
    last: { x: 306, y: 535.3, s: 1 },
    model: { x: 336, y: 421.3, s: 1 },
  };
  componentDidMount() { this.timers = []; this.schedule(false); }
  componentWillUnmount() { this.clear(); }
  componentDidUpdate(prev) {
    if (prev.autoplay !== this.props.autoplay || prev.speed !== this.props.speed) {
      this.clear();
      this.schedule(this.isOpen());
    }
  }
  isOpen() { return !!(this.state && this.state.open); }
  clear() { (this.timers || []).forEach(clearTimeout); this.timers = []; }
  dur() {
    const s = this.props.speed ?? '1x';
    return Math.round(500 / (s === '0.25x' ? 0.25 : s === '0.5x' ? 0.5 : 1));
  }
  // 自动循环：停在列表 1.2 秒 → 打开 → 停在详情 1.6 秒 → 返回。
  schedule(open) {
    if (this.props.autoplay === false) return;
    const wait = this.dur() + (open ? 1600 : 1200);
    this.timers.push(setTimeout(() => { this.setState({ open: !open }); this.schedule(!open); }, wait));
  }
  go(open) { this.clear(); this.setState({ open }); this.schedule(open); }
  renderVals() {
    const EASE = Component.EASE;
    const move = (p) => `transform: translate(${p.x}px, ${p.y}px) scale(${p.s});`;
    const box = (r) => `left: ${r.x}px; top: ${r.y}px; width: ${r.w}px; height: ${r.h}px; border-radius: ${r.r}px;`;
    const fade = (ms, delay) => `opacity ${ms}ms linear ${delay}ms`;
    const open = this.isOpen();
    const d = this.dur();
    const at = open ? Component.PAGE : Component.CARD;
    const shared = (extra) => `position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; transition: transform ${d}ms ${EASE}; ${extra}`;
    const text = 'white-space: nowrap; line-height: 1.5;';
    return {
      openIt: () => this.go(true),
      closeIt: () => this.go(false),
      st: {
        // 上一页原地不动，只被遮罩压暗；卡片底板从卡片的位置长成整页，返回时缩回去。
        list: `position: absolute; inset: 0; pointer-events: ${open ? 'none' : 'auto'};`,
        scrim: `position: absolute; inset: 0; pointer-events: none; background: var(--wb-scrim); opacity: ${open ? 0.6 : 0}; transition: ${fade(d, 0)};`,
        card: `position: absolute; pointer-events: none; ${open ? 'left: 0; top: 0; width: 402px; height: 874px; border-radius: 0; background: var(--wb-bg);' : 'left: 16px; top: 121.8px; width: 370px; height: 116px; border-radius: 20px; background: var(--wb-layer-1);'} transition: left ${d}ms ${EASE}, top ${d}ms ${EASE}, width ${d}ms ${EASE}, height ${d}ms ${EASE}, border-radius ${d}ms ${EASE}, background-color ${d}ms ${EASE};`,
        // 卡片上没对上的字（"最近上报"、箭头）打开时先淡出，返回快到时再淡入。
        label: `position: absolute; left: 132px; top: 173.1px; pointer-events: none; white-space: nowrap; font-size: var(--wb-fs-75); color: var(--wb-text-2); opacity: ${open ? 0 : 1}; transition: ${open ? fade(d * 0.25, 0) : fade(d * 0.3, d * 0.7)};`,
        chev: `position: absolute; left: 350px; top: 169.8px; pointer-events: none; opacity: ${open ? 0 : 1}; transition: ${open ? fade(d * 0.25, 0) : fade(d * 0.3, d * 0.7)};`,
        // 详情的其余内容只在长大的卡片里出现（按同一节奏裁切），随后淡入。
        detail: `position: absolute; inset: 0; opacity: ${open ? 1 : 0}; clip-path: ${open ? 'inset(0px 0px 0px 0px round 0px)' : 'inset(121.8px 16px 636.2px 16px round 20px)'}; pointer-events: ${open ? 'auto' : 'none'}; transition: clip-path ${d}ms ${EASE}, ${open ? fade(d * 0.5, d * 0.35) : fade(d * 0.35, 0)};`,
        // 对上的元素：设备图的底块长成主卡，设备图放大居中，名称飞到标题栏，最近上报与型号飞进信息行。
        tile: `position: absolute; overflow: hidden; pointer-events: none; background: var(--wb-hero-bg); ${box(at.tile)} transition: left ${d}ms ${EASE}, top ${d}ms ${EASE}, width ${d}ms ${EASE}, height ${d}ms ${EASE}, border-radius ${d}ms ${EASE};`,
        deco: `position: absolute; right: -30px; top: -34px; opacity: ${open ? 1 : 0}; transition: ${open ? fade(d * 0.5, d * 0.4) : fade(d * 0.3, 0)};`,
        icon: shared(move(at.icon)),
        name: shared(`${move(at.name)} ${text} font-size: var(--wb-fs-200); font-weight: 800; color: var(--wb-title);`),
        last: shared(`${move(at.last)} ${text} font-size: var(--wb-fs-75); font-weight: 700; color: var(--wb-text-2); font-variant-numeric: tabular-nums;`),
        model: shared(`${move(at.model)} ${text} font-size: var(--wb-fs-75); color: ${open ? 'var(--wb-text-2)' : 'var(--wb-text-3)'};`),
      },
    };
  }
}
</script>
<script>
(() => {
  const defaults = {"speed": "1x", "autoplay": true};
  const query = new URLSearchParams(location.search);
  const props = {};
  for (const [k, v] of Object.entries(defaults)) {
    if (!query.has(k)) { props[k] = v; continue; }
    const q = query.get(k);
    props[k] = typeof v === "boolean" ? !["false", "0"].includes(q) : typeof v === "number" ? Number(q) : q;
  }
  const c = new Component(props);
  const get = (o, path) => path.split(".").reduce((v, k) => (v == null ? v : v[k]), o);
  const bound = [...document.querySelectorAll("*")].filter((el) => el.getAttributeNames().some((n) => n.startsWith("data-dc-")));
  window.dcRender = () => {
    const vals = c.renderVals();
    for (const el of bound) {
      for (const n of el.getAttributeNames()) {
        if (!n.startsWith("data-dc-")) continue;
        const attr = n.slice(8), v = get(vals, el.getAttribute(n));
        if (attr.startsWith("on")) el[attr] = v || null;
        else if (attr === "style") el.style.cssText = v ?? "";
        else if (v == null || v === false) el.removeAttribute(attr);
        else el.setAttribute(attr, v);
      }
    }
  };
  window.dcRender();
  if (c.componentDidMount) c.componentDidMount();
})();
</script></body>
