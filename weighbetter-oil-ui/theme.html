<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>外观</title>
<link rel="stylesheet" href="base.css">
<script src="theme.js"></script>
<style>
  .scroll { height: calc(844px - 47px - 52px); overflow-y: auto; padding: 4px 16px 40px; }

  /* 实时预览：首页第 1 页的缩小版 */
  .preview { padding: 22px 24px 18px; }
  .preview .kicker { display: flex; justify-content: space-between; }
  .preview .big { display: flex; align-items: flex-start; margin-top: 8px; }
  .preview .big b { font: 300 64px/0.9 var(--num); letter-spacing: -3px; }
  .preview .big .unit { margin: 6px 0 0 6px; font-size: 14px; }
  .preview .delta { margin-top: 10px; font-size: 14px; color: var(--ink-2); }
  .preview .delta b { font: 500 18px var(--num); color: var(--accent-ink); margin-right: 8px; }
  .preview svg { display: block; margin-top: 10px; }

  .group { margin-top: 26px; }
  .themes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { position: relative; padding: 10px; border-radius: 20px; background: var(--paper); box-shadow: var(--shadow-paper); cursor: pointer; border: 0; text-align: left; }
  .tile.on { box-shadow: 0 0 0 2px var(--ink), var(--shadow-paper); }
  .swatch { position: relative; height: 74px; border-radius: 13px; overflow: hidden; }
  .swatch .c { position: absolute; left: 10px; right: 10px; top: 10px; bottom: 0; border-radius: 9px 9px 0 0; padding: 9px 10px; }
  .swatch .c b { display: block; font: 300 22px/1 var(--num); letter-spacing: -.5px; }
  .swatch .c i { position: absolute; right: 10px; top: 14px; width: 10px; height: 10px; border-radius: 50%; }
  .swatch .c s { position: absolute; left: 10px; right: 36px; bottom: 12px; height: 4px; border-radius: 2px; text-decoration: none; }
  .tile .n { display: block; margin: 10px 2px 0; font-size: 14px; font-weight: 600; }
  .tile .f { display: block; margin: 2px 2px 2px; font-size: 12px; color: var(--ink-2); }
  .tile .ok { position: absolute; right: 12px; bottom: 12px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: var(--paper); display: none; place-items: center; }
  .tile.on .ok { display: grid; }

  .panel { margin-top: 10px; padding: 16px; border-radius: var(--r-block); background: var(--paper); box-shadow: var(--shadow-paper); }
  .panel h4 { font-size: 13px; font-weight: 400; color: var(--ink-2); margin-bottom: 12px; }
  .hues { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px 0; justify-items: center; }
  .hue { width: 38px; height: 38px; border-radius: 50%; border: 0; cursor: pointer; }
  .hue.on { box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--ink); }
  .slider { margin-top: 18px; -webkit-appearance: none; appearance: none; width: 100%; height: 12px; border-radius: 6px; cursor: pointer; }
  .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); border: 4px solid var(--paper); box-shadow: 0 1px 4px rgba(0, 0, 0, .25); }
  .tones { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 2px; border-radius: 12px; background: var(--mute); }
  .tones button { height: 36px; border: 0; border-radius: 10px; background: transparent; font-size: 14px; color: var(--ink-strong-2); cursor: pointer; }
  .tones button.on { background: var(--paper); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
  .foot-note { margin-top: 18px; padding: 0 4px; }
</style>
</head>
<body>
<main class="phone">
  <div id="sb"></div>
  <header class="nav"><a class="back" href="settings.html?state=main" style="text-decoration:none"><i data-icon="caret-left" data-size="16"></i>设置</a><span class="title">外观</span><span></span></header>

  <div class="scroll">
    <section class="card cream preview" aria-label="预览">
      <p class="kicker"><span>今天 7:41</span><span id="pv-name"></span></p>
      <div class="big"><b>68.25</b><span class="unit">kg</span></div>
      <p class="delta"><b>−0.15</b>比上次轻了一点</p>
      <svg id="pv" width="294" height="64" viewBox="0 0 294 64" aria-hidden="true"></svg>
    </section>

    <section class="group">
      <p class="section-label">主题</p>
      <div class="themes" id="themes"></div>
    </section>

    <section class="group">
      <p class="section-label">自定义搭配</p>
      <button class="tile" id="custom-tile" style="width:100%">
        <span class="n">用自己的颜色</span>
        <span class="f">选一个强调色和底色的冷暖，其余颜色自动搭配</span>
        <span class="ok"><i data-icon="check" data-size="14"></i></span>
      </button>
      <div class="panel" id="custom-panel">
        <h4>强调色</h4>
        <div class="hues" id="hues"></div>
        <input class="slider" id="slider" type="range" min="0" max="359" aria-label="强调色色相">
        <h4 style="margin-top:20px">底色</h4>
        <div class="tones" id="tones"></div>
      </div>
    </section>

    <p class="note foot-note">主题只改变外观。"还没归属"的琥珀色和解绑、注销用的红色不随主题变化，免得和数据颜色混在一起。</p>
  </div>
</main>
<script src="icons.js"></script>
<script src="ui.js"></script>
<script>
  document.getElementById('sb').outerHTML = UI.statusbar();
  UI.hydrate();
  const HUES = [38, 15, 350, 320, 290, 265, 245, 220, 195, 165, 140, 95];

  // 预设卡片：用该主题自己的颜色画一张小样
  document.getElementById('themes').innerHTML = THEME.PRESETS.map(t => `
    <button class="tile" data-id="${t.id}">
      <span class="swatch" style="display:block;background:${t.bg}">
        <span class="c" style="background:${t.card};color:${t.ink}"><b>68.25</b><i style="background:${t.accent}"></i><s style="background:${THEME.mix(t.ink, 0.14, t.card)}"></s></span>
      </span>
      <span class="n">${t.name}</span><span class="f">${t.from}</span>
      <span class="ok">${UI.icon('check', 14)}</span>
    </button>`).join('');
  document.getElementById('hues').innerHTML = HUES.map(h => `<button class="hue" data-h="${h}" aria-label="色相 ${h}" style="background:${THEME.hex(`oklch(0.57 0.15 ${h})`)}"></button>`).join('');
  document.getElementById('tones').innerHTML = Object.entries(THEME.TONES).map(([k, n]) => `<button data-tone="${k}">${n}</button>`).join('');

  function render() {
    const cur = THEME.current, isCustom = cur.id === 'custom';
    document.querySelectorAll('#themes .tile').forEach(b => b.classList.toggle('on', b.dataset.id === cur.id));
    document.getElementById('custom-tile').classList.toggle('on', isCustom);
    const h = isCustom ? +cur.h : 38, tone = isCustom ? cur.tone : 'follow';
    document.querySelectorAll('.hue').forEach(b => b.classList.toggle('on', isCustom && +b.dataset.h === h));
    document.querySelectorAll('#tones button').forEach(b => b.classList.toggle('on', b.dataset.tone === tone));
    document.getElementById('slider').value = h;
    document.getElementById('pv-name').textContent = THEME.resolve(cur).name;
    // 预览里的 7 次读数
    const v = [68.92, 68.70, 68.76, 68.58, 68.50, 68.40, 68.25], lo = Math.min(...v), hi = Math.max(...v);
    const x = i => 6 + i * (282 / 6), y = t => 8 + (hi - t) / (hi - lo) * 46;
    let o = `<polyline points="${v.map((t, i) => `${x(i)},${y(t)}`).join(' ')}" fill="none" stroke="${THEME.v('--ink')}" stroke-opacity=".14" stroke-width="1.5"/>`;
    v.forEach((t, i) => { o += i === 6 ? `<circle cx="${x(i)}" cy="${y(t)}" r="6" fill="${THEME.v('--accent')}" stroke="${THEME.v('--card')}" stroke-width="2"/>` : `<circle cx="${x(i)}" cy="${y(t)}" r="3.5" fill="${THEME.v('--ink-2')}"/>`; });
    document.getElementById('pv').innerHTML = o;
  }
  const setCustom = patch => {
    const c = THEME.current.id === 'custom' ? THEME.current : { id: 'custom', h: 38, tone: 'follow' };
    THEME.set({ ...c, ...patch, id: 'custom' }); render();
  };
  document.getElementById('themes').addEventListener('click', e => { const b = e.target.closest('.tile'); if (b) { THEME.set({ id: b.dataset.id }); render(); } });
  document.getElementById('custom-tile').addEventListener('click', () => setCustom({}));
  document.getElementById('hues').addEventListener('click', e => { const b = e.target.closest('.hue'); if (b) setCustom({ h: +b.dataset.h }); });
  document.getElementById('slider').addEventListener('input', e => setCustom({ h: +e.target.value }));
  document.getElementById('tones').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setCustom({ tone: b.dataset.tone }); });
  // 色相滑条的彩虹轨道：颜色在 JS 里算好，老浏览器不认 oklch 也能显示
  document.getElementById('slider').style.background = `linear-gradient(90deg, ${[0, 60, 120, 180, 240, 300, 360].map(h => THEME.hex(`oklch(0.57 0.15 ${h})`)).join(', ')})`;
  render();
  // ?focus=custom 直接滚到自定义搭配（截图用）
  if (new URLSearchParams(location.search).get('focus') === 'custom') document.querySelector('.scroll').scrollTop = 9999;
</script>
</body>
</html>
