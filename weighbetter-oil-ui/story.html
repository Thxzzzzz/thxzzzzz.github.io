<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今天</title>
<link rel="stylesheet" href="base.css">
<script src="theme.js"></script>
<style>
  /* 今天的报告：4 张同一底面的卡片，一页只讲一件事。强调色只落在"你现在在哪里" */
  .deck { position: relative; height: 584px; }
  .deck .card { position: absolute; top: 0; bottom: 0; left: 16px; width: 344px; transition: transform .5s cubic-bezier(.22,.9,.24,1), opacity .35s; }
  .deck .card.peek { transform: translateX(352px) scale(.92); }
  .deck .card.gone { transform: translateX(-370px) scale(.96); opacity: 0; }
  .deck .card.hidden { opacity: 0; transform: translateX(370px) scale(.92); }
  .tap { position: absolute; top: 0; bottom: 0; width: 50%; z-index: 5; cursor: pointer; }
  .tap.l { left: 0; } .tap.r { right: 0; }

  .in { position: relative; z-index: 2; padding: 30px 28px 0; }
  .in .h1 { margin-top: 4px; }
  .hero { display: flex; align-items: flex-start; margin-top: 14px; }
  .hero .u { margin: 10px 0 0 8px; }
  .delta { display: flex; align-items: baseline; gap: 10px; margin-top: 18px; font-size: 15px; color: var(--ink-2); }
  .delta b { font: 500 24px var(--num); color: var(--accent); letter-spacing: -.3px; }
  .foot { position: absolute; left: 28px; right: 24px; bottom: 24px; z-index: 3; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--ink-2); }
  .foot .go { display: inline-flex; align-items: center; gap: 2px; color: var(--ink); }
  .chart { position: absolute; left: 0; bottom: 0; z-index: 1; }

  /* 第 2 页：100 个点，一点 = 体重的 1%，全部用暖灰明度阶梯 */
  .dots { display: grid; grid-template-columns: repeat(10, 16px); gap: 8px; margin-top: 24px; }
  .dots i { width: 16px; height: 16px; border-radius: 50%; }
  .legend { margin-top: 24px; display: grid; gap: 10px; }
  .legend div { display: grid; grid-template-columns: 10px 1fr auto 48px; align-items: baseline; gap: 12px; font-size: 14px; color: var(--ink-2); }
  .legend em { width: 10px; height: 10px; border-radius: 50%; align-self: center; }
  .legend b { font: 400 20px var(--num); color: var(--ink); }
  .legend b small { font-size: 13px; margin-left: 3px; color: var(--ink-2); }
  .legend .pct { font: 400 13px var(--num); text-align: right; }

  /* 第 3 页 */
  .lv { display: flex; align-items: baseline; gap: 14px; margin-top: 12px; }
  .lv .v { font: 300 64px/1 var(--num); letter-spacing: -2px; }
  .lv .note { margin-left: auto; }
  .scale { position: relative; margin-top: 28px; }
  .scale .track { gap: 3px; }
  .scale .pin { width: 14px; height: 14px; margin-left: -7px; top: -4px; background: var(--accent); box-shadow: 0 0 0 3px var(--card); }
  .scale .ticks { position: relative; height: 18px; margin-top: 10px; font: 400 13px var(--num); color: var(--ink-2); }
  .scale .ticks span { position: absolute; transform: translateX(-50%); }
  .hist { margin-top: 40px; }
  .hist .vals, .hist .bars, .hist .days { display: grid; grid-template-columns: repeat(6, 1fr); justify-items: center; }
  .hist .vals { margin-top: 16px; font: 500 15px var(--num); }
  .hist .bars { align-items: end; height: 84px; margin-top: 8px; }
  .hist .bars i { width: 8px; border-radius: 4px; background: var(--bar); }
  .hist .bars i.now { background: var(--accent); }
  .hist .days { margin-top: 8px; font: 400 13px var(--num); color: var(--ink-2); }

  .pager { display: flex; justify-content: center; gap: 6px; margin-top: 16px; }
  .pager i { width: 5px; height: 5px; border-radius: 3px; background: var(--pager); transition: width .3s, background .3s; cursor: pointer; }
  .pager i.on { width: 20px; background: var(--ink); }
</style>
</head>
<body>
<main class="phone">
  <div id="sb"></div>
  <header class="head"><span class="t">我<i data-icon="caret-down" data-size="16" data-color="var(--ink-2)"></i></span><span class="meta">客厅的秤</span></header>

  <section class="deck" aria-label="今天的报告，共 4 页">
    <article class="card cream" data-page="0">
      <div class="in">
        <p class="kicker">今天 7:41</p>
        <div class="hero"><span class="hero-num">68.25</span><span class="unit">kg</span></div>
        <div class="delta"><b>−0.15</b><span>比上次轻了一点</span></div>
      </div>
      <svg class="chart" id="c7" width="344" height="360" viewBox="0 0 344 360" aria-label="最近 7 次体重"></svg>
      <div class="foot"><span>最近 7 次</span></div>
    </article>

    <article class="card cream" data-page="1">
      <div class="in">
        <p class="kicker">68.25 kg 里</p>
        <h2 class="h1">肌肉占了四分之三</h2>
        <div class="dots" id="dots" aria-label="100 个点，每个是体重的 1%"></div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="foot"><span>一个点是体重的 1%</span></div>
    </article>

    <article class="card cream" data-page="2">
      <div class="in">
        <p class="kicker">需要留意</p>
        <h2 class="h1">内脏脂肪有点高</h2>
        <div class="lv"><span class="v">11</span><span class="unit">级</span><span class="note">标准在 9 级以内</span></div>
        <div class="scale" id="scale"></div>
        <div class="hist"><p class="note">最近 6 次，从 12 级回到了 11 级</p><div class="vals" id="hv"></div><div class="bars" id="hb"></div><div class="days" id="hd"></div></div>
      </div>
    </article>

    <article class="card cream" data-page="3">
      <div class="in">
        <p class="kicker">最近 30 天</p>
        <h2 class="h1">一共轻了 <span class="num" style="font-weight:500">1.35</span> kg</h2>
        <p class="note" style="margin-top:6px;font-size:15px">离目标 66.0 kg 还差 2.25 kg</p>
      </div>
      <svg class="chart" id="c30" width="344" height="420" viewBox="0 0 344 420" aria-label="最近 30 天体重"></svg>
      <div class="foot"><span>称了 23 次</span><span class="go">完整报告<i data-icon="caret-right" data-size="13"></i></span></div>
    </article>

    <div class="tap l" data-step="-1" aria-label="上一页"></div>
    <div class="tap r" data-step="1" aria-label="下一页"></div>
  </section>

  <nav class="pager" id="pager" aria-label="第几页"><i></i><i></i><i></i><i></i></nav>
  <div id="dock"></div>
</main>
<script src="icons.js"></script>
<script src="data.js"></script>
<script src="ui.js"></script>
<script>
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  document.getElementById('sb').outerHTML = UI.statusbar();
  document.getElementById('dock').outerHTML = UI.dock('today');
  UI.hydrate();
  const card = css('--card'), acc = css('--accent'), ink = css('--ink'), ink2 = css('--ink-2');
  // 文字底下垫一圈卡面色，线从后面穿过时不会碰字
  const label = (x, y, t, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.anchor || 'start'}" font-size="${o.size || 13}" font-weight="${o.weight || 400}" fill="${o.fill || ink2}" font-family="Outfit, -apple-system" stroke="${o.halo === false ? 'none' : card}" stroke-width="6" stroke-linejoin="round" paint-order="stroke">${t}</text>`;

  // 第 1 页：最近 7 次的离散读数，只回答"这次和前几次比"
  {
    const r = WB.recent, v = r.map(p => p.v), lo = Math.min(...v), hi = Math.max(...v);
    const x = i => 44 + i * (256 / (v.length - 1)), y = t => 50 + (hi - t) / (hi - lo) * 210;
    let o = `<line x1="28" x2="316" y1="${y(hi)}" y2="${y(hi)}" stroke="${ink}" stroke-opacity=".07"/><line x1="28" x2="316" y1="${y(lo)}" y2="${y(lo)}" stroke="${ink}" stroke-opacity=".07"/>`;
    // 折线下面垫一块暖灰面积给画面托底；用墨色而不用强调色，和第 4 页的橙色走势区分开
    const pts = v.map((t, i) => `${x(i)},${y(t)}`).join(' '), base = y(lo) + 40;
    o += `<polygon points="${x(0)},${base} ${pts} ${x(v.length - 1)},${base}" fill="${ink}" fill-opacity=".05"/>`;
    o += `<polyline points="${pts}" fill="none" stroke="${ink}" stroke-opacity=".22" stroke-width="1.5" stroke-linejoin="round"/>`;
    v.forEach((t, i) => {
      const last = i === v.length - 1;
      o += last ? `<circle cx="${x(i)}" cy="${y(t)}" r="7" fill="${acc}" stroke="${card}" stroke-width="2"/>` : `<circle cx="${x(i)}" cy="${y(t)}" r="4" fill="${ink2}"/>`;
    });
    o += label(x(0) - 4, y(v[0]) - 14, `${r[0].day}  ${v[0].toFixed(2)}`);
    o += label(x(v.length - 1), y(v.at(-1)) + 28, '今天', { anchor: 'middle', fill: ink, halo: false });
    document.getElementById('c7').innerHTML = o;
  }

  // 第 4 页：连续走势 + 目标线；面积是 8% 纯色，下沿收在目标线上，右沿和目标线一起停
  {
    const raw = [69.60, 69.42, 69.55, 69.30, 69.38, 69.12, 69.20, 69.05, 69.18, 68.96, 68.88, 69.02, 68.80,
                 68.92, 68.70, 68.76, 68.58, 68.66, 68.50, 68.62, 68.44, 68.40, 68.25];
    const s = raw.map((t, i) => i === 0 || i === raw.length - 1 ? t : (raw[i - 1] + t + raw[i + 1]) / 3);
    const goal = 66.0, lo = goal, hi = Math.max(...s) + 0.1;
    const x0 = 28, x1 = 316, x = i => x0 + i * ((x1 - x0) / (s.length - 1)), y = t => 60 + (hi - t) / (hi - lo) * 270;
    const pts = s.map((t, i) => [x(i), y(t)]), gy = y(goal), last = pts.at(-1);
    const line = pts.reduce((d, p, i, a) => {
      if (!i) return `M${p}`;
      const p0 = a[i - 2] || a[i - 1], p1 = a[i - 1], p3 = a[i + 1] || p;
      return `${d} C${[p1[0] + (p[0] - p0[0]) / 6, p1[1] + (p[1] - p0[1]) / 6]},${[p[0] - (p3[0] - p1[0]) / 6, p[1] - (p3[1] - p1[1]) / 6]},${p}`;
    }, '');
    let o = `<path d="${line} L${x1},${gy} L${x0},${gy} Z" fill="${acc}" fill-opacity=".08"/>`;
    o += `<line x1="${x0}" x2="${x1}" y1="${gy}" y2="${gy}" stroke="${ink}" stroke-opacity=".28"/>`;
    o += label(x1, gy - 10, '目标 66.0', { anchor: 'end', size: 13 });
    o += `<path d="${line}" fill="none" stroke="${acc}" stroke-width="2" stroke-linecap="round"/>`;
    o += label(x0, pts[0][1] - 14, raw[0].toFixed(2));
    o += `<circle cx="${last[0]}" cy="${last[1]}" r="5" fill="${acc}" stroke="${card}" stroke-width="2"/>`;
    o += label(last[0], last[1] - 18, raw.at(-1).toFixed(2), { anchor: 'end', size: 14, weight: 500, fill: ink });
    document.getElementById('c30').innerHTML = o;
  }

  // 第 2 页：肌肉 76、脂肪 19、骨骼 4、其他 1（空心）
  {
    const parts = [['肌肉', 52.1, 76, THEME.v('--cat-1')], ['脂肪', 12.7, 19, THEME.v('--cat-2')], ['骨骼', 2.9, 4, THEME.v('--cat-3')], ['其他', 0.6, 1, 'hollow']];
    const dot = c => c === 'hollow' ? 'style="box-shadow:inset 0 0 0 1.5px var(--cat-2)"' : `style="background:${c}"`;
    document.getElementById('dots').innerHTML = parts.flatMap(([, , n, c]) => Array(n).fill(`<i ${dot(c)}></i>`)).join('');
    document.getElementById('legend').innerHTML = parts.map(([n, kg, pct, c]) =>
      `<div><em ${dot(c)}></em><span>${n}</span><b>${kg.toFixed(1)}<small>kg</small></b><span class="pct">${pct}%</span></div>`).join('');
  }

  // 第 3 页：内脏脂肪 1–20 级，标准 ≤9、偏高 10–14、过高 ≥15；三段都是暖灰，只有你的位置是强调色
  {
    const min = 1, max = 20, v = 11, p = t => (t - min) / (max - min) * 100;
    const segs = [[1, 9.5, THEME.v('--seg-1')], [9.5, 14.5, THEME.v('--seg-2')], [14.5, 20, THEME.v('--seg-3')]];
    document.getElementById('scale').innerHTML =
      `<div class="track">${segs.map(([a, b, c]) => `<i style="flex:${b - a};background:${c}"></i>`).join('')}<span class="pin" style="left:${p(v)}%"></span></div>
       <div class="ticks"><span style="left:${p(9.5)}%">9</span><span style="left:${p(14.5)}%">14</span></div>`;
    const hist = [['8/28', 12], ['9/9', 12], ['9/21', 12], ['10/2', 11], ['10/11', 11], ['今天', 11]];
    document.getElementById('hv').innerHTML = hist.map(([, t]) => `<span>${t}</span>`).join('');
    document.getElementById('hb').innerHTML = hist.map(([, t], i) => `<i class="${i === hist.length - 1 ? 'now' : ''}" style="height:${(t - 7) * 14}px"></i>`).join('');
    document.getElementById('hd').innerHTML = hist.map(([d], i) => `<span style="${i === hist.length - 1 ? 'color:var(--ink)' : ''}">${d}</span>`).join('');
  }

  // 翻页：点卡片右半边下一页、左半边上一页，方向键也可以；?page=1..4 直接进入
  const cards = [...document.querySelectorAll('.deck .card')], dots = [...document.querySelectorAll('#pager i')];
  let cur = Math.min(Math.max((+new URLSearchParams(location.search).get('page') || 1) - 1, 0), 3);
  function show(i) {
    cur = Math.min(Math.max(i, 0), cards.length - 1);
    cards.forEach((c, k) => {
      c.classList.toggle('gone', k < cur);
      c.classList.toggle('peek', k === cur + 1);
      c.classList.toggle('hidden', k > cur + 1);
      c.style.zIndex = k === cur ? 4 : k === cur + 1 ? 2 : 1;
    });
    dots.forEach((d, k) => d.classList.toggle('on', k === cur));
  }
  document.querySelectorAll('.tap').forEach(t => t.addEventListener('click', () => show(cur + +t.dataset.step)));
  dots.forEach((d, k) => d.addEventListener('click', () => show(k)));
  addEventListener('keydown', e => { if (e.key === 'ArrowRight') show(cur + 1); if (e.key === 'ArrowLeft') show(cur - 1); });
  show(cur);
</script>
</body>
</html>
