<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thxzzzzz</title>
<meta name="description" content="Thxzzzzz 的个人主页">
<style>
:root {
  --bg: #f6f5f1;
  --fg: #1d1f1c;
  --muted: #6b6f68;
  --rule: #d9d8d2;
  --accent: #2f5d50;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151715;
    --fg: #e7e8e3;
    --muted: #9a9f97;
    --rule: #2c302b;
    --accent: #8fc3b2;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
}
main {
  max-width: 36rem;
  margin: 0 auto;
  padding: 18vh max(20px, env(safe-area-inset-right)) 4rem max(20px, env(safe-area-inset-left));
  display: flex;
  flex-direction: column;
  gap: 2.5rem;
}
h1 { margin: 0; font-size: 2rem; font-weight: 600; letter-spacing: -0.01em; }
.intro { margin: 0.5rem 0 0; color: var(--muted); }
h2 { margin: 0 0 0.75rem; font-size: 0.9rem; font-weight: 600; color: var(--muted); }
.works { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.works li { border-bottom: 1px solid var(--rule); }
.works a { display: flex; flex-direction: column; gap: 0.15rem; padding: 0.9rem 0; color: inherit; text-decoration: none; }
.works strong { font-weight: 600; color: var(--accent); }
.works span { color: var(--muted); font-size: 0.92rem; }
.works a:hover strong { text-decoration: underline; text-underline-offset: 3px; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 2px; }
footer { color: var(--muted); font-size: 0.85rem; }
footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Thxzzzzz</h1>
    <p class="intro">个人主页还在整理中，先放一些正在做的东西。</p>
  </header>
  <section>
    <h2>作品</h2>
    <ul class="works">
      <li>
        <a href="weighbetter/view.html">
          <strong>WeighBetter 设计方向</strong>
          <span>体脂秤 App 的界面风格候选，手机和电脑都能浏览</span>
        </a>
      </li>
      <li>
        <a href="weighbetter-oil-ui/">
          <strong>WeighBetter 设计稿 · oil-ui 版</strong>
          <span>另一条设计线：快报式首页、7 组页面原型，可在设置里切换主题和自定义配色</span>
        </a>
      </li>
      <li>
        <a href="weighbetter-motion/view.html">
          <strong>WeighBetter 转场动效候选</strong>
          <span>卡片点开页面的几种"一镜到底"转场，自动循环打开与返回，也可以点卡片试</span>
        </a>
      </li>
    </ul>
  </section>
  <footer>
    <a href="https://github.com/Thxzzzzz">GitHub @Thxzzzzz</a>
  </footer>
</main>
</body>
</html>
