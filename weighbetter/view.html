<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WeighBetter 设计方向 · 交互预览</title>
<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;background:#E4E4E0;color:#1C1C1C;font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif}
aside{width:300px;flex:none;overflow:auto;background:#FFFFFF;border-right:1px solid #D9D9D4;padding:16px 0}
aside h1{margin:0 16px 4px;font-size:17px} aside p{margin:0 16px 12px;font-size:12px;color:#77776F}
aside h2{margin:18px 16px 6px;font-size:13px;color:#77776F;font-weight:600}
aside a{display:block;padding:9px 16px;font-size:15px;color:#1C1C1C;text-decoration:none}
aside a:hover{background:#F2F2EF} aside a.on{background:#1C1C1C;color:#FFFFFF}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-width:0}
.bar{display:flex;align-items:center;gap:12px;font-size:15px}
.bar button{height:40px;padding:0 16px;border:1px solid #C9C9C4;border-radius:20px;background:#FFFFFF;font:inherit;cursor:pointer}
.bar span{min-width:220px;text-align:center;font-weight:600}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;background:#FFFFFF;box-shadow:0 0 0 10px #1C1C1C,0 20px 60px rgba(0,0,0,.25);transform-origin:center}
.phone iframe{width:390px;height:844px;border:0;display:block}
.hint{font-size:12px;color:#77776F}
.mobile-only{display:none}
@media (max-width: 720px) {
  body{display:block;height:auto;background:#FFFFFF}
  aside{display:none;position:fixed;inset:0;z-index:20;width:auto;border:0;padding:12px 0 40px}
  aside.open{display:block}
  aside a{padding:13px 16px;font-size:16px}
  .mobile-only{display:inline-flex;align-items:center;justify-content:center}
  .bar button{display:inline-flex;align-items:center;justify-content:center}
  main{display:block}
  .bar{position:sticky;top:0;z-index:10;gap:6px;padding:8px 10px;background:rgba(255,255,255,.96);border-bottom:1px solid #E4E4E0}
  .bar button{height:40px;padding:0 12px;flex:none}
  .bar span{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .label{display:none}
  .stage{overflow:hidden}
  .phone{border-radius:0;box-shadow:none;transform-origin:top left}
  .hint{padding:14px 12px 28px;text-align:center;font-size:13px}
}
</style>
</head>
<body>
<aside id="nav"><button id="close" class="mobile-only" style="margin:0 16px 8px;height:40px;padding:0 16px;border:1px solid #C9C9C4;border-radius:20px;background:#FFFFFF;font:inherit;font-size:15px">关闭目录</button><h1>WeighBetter 设计方向</h1><p>点选切换；页面内按钮可点击；← → 键或左右滑动翻页</p></aside>
<main>
  <div class="bar"><button id="menu" class="mobile-only">目录</button><button id="prev">←<span class="label"> 上一张</span></button><span id="name"></span><button id="next"><span class="label">下一张 </span>→</button></div>
  <div class="stage" id="stage"><div class="phone" id="phone"><iframe id="frame" title="设计稿"></iframe></div></div>
  <div class="hint"><a id="open" href="#" target="_blank">单独打开</a> · <a href="index.html">平铺总览</a> · <a href="../index.html">返回首页</a></div>
</main>
<script>
const groups = [{"group": "入选 · 仪器与实体触感", "boards": [{"title": "S1 Braun 成熟版", "page": "R6-S1-Braun.html"}, {"title": "B4 粗野控件 + S1 表盘", "page": "R8-B4-Dial.html"}, {"title": "T1 新拟物 · 触感", "page": "R10-T01-Tactile.html"}, {"title": "P3 新拟态", "page": "R9-P3-Neumorph.html"}, {"title": "L4 北欧高端音响", "page": "R10-L04-Nordic.html"}]}, {"group": "入选 · 粗线条与个性", "boards": [{"title": "B1 粗野控件 · Braun 暖灰橙", "page": "R8-B1-Warm.html"}, {"title": "S2 Nothing 成熟版", "page": "R6-S2-Dot.html"}, {"title": "T6 多巴胺配色", "page": "R10-T06-Dopamine.html"}, {"title": "T7 手绘涂鸦", "page": "R10-T07-Doodle.html"}, {"title": "T9 像素风", "page": "R10-T09-Pixel.html"}, {"title": "T12 拼贴剪贴簿", "page": "R10-T12-Collage.html"}]}, {"group": "入选 · 成熟设计系统", "boards": [{"title": "K1 Material 3 Expressive 2026", "page": "R9-K1-M3E26.html"}, {"title": "K2 Microsoft Fluent 2", "page": "R9-K2-Fluent.html"}, {"title": "K6 Adobe Spectrum 2", "page": "R9-K6-Spectrum.html"}, {"title": "P1 Bento 便当格", "page": "R9-P1-Bento.html"}]}, {"group": "入选 · 安静留白", "boards": [{"title": "T4 安静界面", "page": "R10-T04-Quiet.html"}]}, {"group": "入选 · 原创实物", "boards": [{"title": "N1 调频窗", "page": "R11-N1-Tuner.html"}, {"title": "N2 量筒", "page": "R11-N2-Tubes.html"}, {"title": "N3 键帽", "page": "R11-N3-Keycaps.html"}, {"title": "N4 贴纸板", "page": "R11-N4-Stickers.html"}, {"title": "N5 日历拨盘", "page": "R11-N5-DayDial.html"}, {"title": "N6 积木塔", "page": "R11-N6-Blocks.html"}, {"title": "N7 标签机", "page": "R11-N7-LabelTape.html"}, {"title": "N8 集章卡", "page": "R11-N8-StampCard.html"}]}, {"group": "入选 · 原创实物（二）", "boards": [{"title": "Q1 卷尺", "page": "R12-Q1-Tape.html"}, {"title": "Q2 登机牌", "page": "R12-Q2-BoardingPass.html"}, {"title": "Q3 水平仪", "page": "R12-Q3-Level.html"}, {"title": "Q4 翻牌显示器", "page": "R12-Q4-SplitFlap.html"}, {"title": "Q5 打孔卡", "page": "R12-Q5-PunchCard.html"}, {"title": "Q6 登山路线", "page": "R12-Q6-Trail.html"}, {"title": "Q7 撕页日历", "page": "R12-Q7-TearOff.html"}, {"title": "Q8 十字绣", "page": "R12-Q8-CrossStitch.html"}, {"title": "Q9 小票", "page": "R12-Q9-Receipt.html"}, {"title": "Q10 冰箱贴", "page": "R12-Q10-Magnets.html"}]}, {"group": "入选 · oil-ui 融合", "boards": [{"title": "M5 静 · 地平线", "page": "R13-M5-Horizon.html"}]}];
const flat = groups.flatMap(g => g.boards.map(b => ({...b, group: g.group})));
const nav = document.getElementById("nav"), frame = document.getElementById("frame");
const links = {};
for (const g of groups) {
  const h = document.createElement("h2"); h.textContent = g.group; nav.appendChild(h);
  for (const b of g.boards) {
    const a = document.createElement("a"); a.href = "#" + b.page; a.textContent = b.title;
    a.addEventListener("click", () => nav.classList.remove("open"));
    nav.appendChild(a); links[b.page] = a;
  }
}
function current() { return decodeURIComponent(location.hash.slice(1)) || flat[0].page; }
function show(page, fromFrame) {
  const i = flat.findIndex(b => b.page === page);
  const b = flat[i < 0 ? 0 : i];
  document.getElementById("name").textContent = mobile.matches ? b.title : b.group + " · " + b.title;
  document.getElementById("open").href = b.page;
  for (const [p, a] of Object.entries(links)) a.classList.toggle("on", p === b.page);
  links[b.page]?.scrollIntoView({block: "nearest"});
  if (!fromFrame && !frame.src.endsWith("/" + b.page)) frame.src = b.page;
}
function step(d) {
  const i = flat.findIndex(b => b.page === current());
  location.hash = flat[(i + d + flat.length) % flat.length].page;
}
window.addEventListener("hashchange", () => show(current()));
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
document.getElementById("menu").onclick = () => { nav.classList.add("open"); links[current()]?.scrollIntoView({block: "center"}); };
document.getElementById("close").onclick = () => nav.classList.remove("open");
const keys = e => { if (e.key === "ArrowLeft") step(-1); if (e.key === "ArrowRight") step(1); };
document.addEventListener("keydown", keys);
function swipe(target) {
  let x0 = 0, y0 = 0;
  target.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive: true});
  target.addEventListener("touchend", e => {
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 60 && Math.abs(dy) < 50) step(dx < 0 ? 1 : -1);
  }, {passive: true});
}
frame.addEventListener("load", () => {
  const page = frame.contentWindow.location.pathname.split("/").pop();
  if (page && page !== current()) { history.replaceState(null, "", "#" + page); show(page, true); }
  frame.contentDocument.addEventListener("keydown", keys);
  swipe(frame.contentDocument);
});
const mobile = window.matchMedia("(max-width: 720px)");
function fit() {
  const phone = document.getElementById("phone"), stage = document.getElementById("stage");
  if (mobile.matches) {
    const s = window.innerWidth / 390;
    phone.style.transform = "scale(" + s + ")";
    stage.style.height = Math.ceil(844 * s) + "px";
  } else {
    const s = Math.min(1, (window.innerHeight - 120) / 864, (window.innerWidth - 340) / 410);
    phone.style.transform = "scale(" + s + ")";
    stage.style.height = "";
  }
}
mobile.addEventListener("change", fit);
window.addEventListener("resize", fit); fit(); show(current());
</script>
</body>
</html>
